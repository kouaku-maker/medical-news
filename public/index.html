<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>透析・CE 新着チェック</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e4a5c">
<style>
  :root { --bg:#f3f6f8; --ink:#14262d; --sub:#5b6f77; --accent:#0e4a5c; --line:#d3dde2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10191d; --ink:#e6eef1; --sub:#93a7af; --accent:#5cc0d8; --line:#27373e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    background:var(--bg); color:var(--ink);
    font:16px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:36rem; margin:0 auto; padding:24px 0 48px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:1.25rem; margin:0; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--accent); border-radius:6px;
    background:transparent; color:var(--accent); }
  button.on { background:var(--accent); color:var(--bg); }
  button:disabled { opacity:.4; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 8px; }
  #meta { color:var(--sub); font-size:.85rem; min-height:1.5em; }
  ul { list-style:none; margin:8px 0 0; padding:0; }
  li { padding:14px 0 14px 12px; border-top:1px solid var(--line); border-left:3px solid transparent; }
  li.unread { border-left-color:var(--accent); }
  li.unread a { font-weight:700; }
  li small { display:block; color:var(--sub); }
  a { color:var(--ink); text-decoration:none; }
  a:visited { color:var(--sub); }
  details { margin:8px 0 0; }
  summary { color:var(--accent); padding:6px 0; }
  #srclist { margin:4px 0 12px; }
  #srclist li { border:0; padding:6px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #srclist button { padding:4px 10px; font-size:.85rem; }
  input { width:100%; font:inherit; padding:10px; margin:0 0 8px; border:1px solid var(--line);
    border-radius:6px; background:transparent; color:var(--ink); }
  input:focus-visible { outline:3px solid var(--accent); outline-offset:1px; }
  #msg { min-height:1.5em; font-size:.9rem; }
  .empty { color:var(--sub); padding:24px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>透析・CE 新着チェック</h1>
    <button id="refresh">更新</button>
  </header>
  <div id="chips"></div>
  <details id="manage">
    <summary>取得するサイトを管理</summary>
    <ul id="srclist"></ul>
    <input id="u" type="url" inputmode="url" placeholder="サイトまたはRSSのURL" autocomplete="off">
    <input id="n" type="text" placeholder="表示名(省略するとサイトの名前)">
    <input id="pw" type="password" placeholder="管理パスワード" autocomplete="current-password">
    <button id="add" class="on">サイトを追加</button>
    <div id="msg" role="status"></div>
  </details>
  <div id="meta" role="status"></div>
  <button id="readall" class="on" hidden>すべて既読にする</button>
  <ul id="list"></ul>
</main>

<script>
const $ = (id) => document.getElementById(id);
let data = { items: [], sources: [], meta: null }, filter = 'all';

const readUpTo = () => Number(localStorage.getItem('readUpTo') || 0);
const fmt = (t) => new Date(t).toLocaleDateString('ja-JP', { year:'numeric', month:'numeric', day:'numeric' });
const safe = (u) => /^https?:\/\//.test(u) ? u : '#';

function render() {
  const base = readUpTo();
  const items = data.items.filter((i) => filter === 'all' || i.source === filter);
  const unread = data.items.filter((i) => i.added > base).length;

  $('chips').replaceChildren(...[{ id:'all', name:'すべて' }, ...data.sources].map((s) => {
    const b = document.createElement('button');
    b.textContent = s.name;
    if (s.id === filter) b.className = 'on';
    b.onclick = () => { filter = s.id; render(); };
    return b;
  }));

  $('readall').hidden = unread === 0;
  $('readall').textContent = `すべて既読にする(未読${unread}件)`;
  const m = data.meta;
  $('meta').textContent = m
    ? `最終更新: ${new Date(m.updated).toLocaleString('ja-JP')}` + (m.errors.length ? ` / 取得に失敗: ${m.errors.join(', ')}` : '')
    : '';

  if (!items.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '新着はまだありません。「更新」を押して取得してください。';
    return $('list').replaceChildren(p);
  }
  $('list').replaceChildren(...items.map((i) => {
    const li = document.createElement('li');
    if (i.added > base) li.className = 'unread';
    const a = document.createElement('a');
    a.href = safe(i.link); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = i.title;
    const s = document.createElement('small');
    s.textContent = `${fmt(i.date)}  ${i.sourceName}`;
    li.append(a, s);
    return li;
  }));
}

async function load() {
  try {
    data = await (await fetch('/api/items')).json();
    if (!localStorage.getItem('readUpTo')) localStorage.setItem('readUpTo', Date.now());
    render();
  } catch (e) { $('meta').textContent = '読み込みに失敗しました。通信を確認してください。'; }
}

$('refresh').onclick = async () => {
  $('refresh').disabled = true;
  try {
    const r = await (await fetch('/api/refresh', { method:'POST' })).json();
    await load();
    if (r.skipped) $('meta').textContent += ' / 直前に更新済みです(5分に1回まで)';
  } catch (e) { $('meta').textContent = '更新に失敗しました。'; }
  $('refresh').disabled = false;
};
$('readall').onclick = () => { localStorage.setItem('readUpTo', Date.now()); render(); };


async function loadSources() {
  const d = await (await fetch('/api/sources')).json();
  $('srclist').replaceChildren(...d.sources.map((x) => {
    const li = document.createElement('li');
    const t = document.createElement('span');
    t.textContent = x.name;
    li.append(t);
    if (x.custom) {
      const b = document.createElement('button');
      b.textContent = '削除';
      b.onclick = () => removeSource(x);
      li.append(b);
    }
    return li;
  }));
}

const headers = () => ({ 'Content-Type':'application/json', 'x-admin-password': $('pw').value });
$('pw').value = localStorage.getItem('pw') || '';

async function addSource() {
  $('add').disabled = true;
  $('msg').textContent = '確認しています…';
  try {
    const r = await fetch('/api/sources', { method:'POST', headers: headers(),
      body: JSON.stringify({ url: $('u').value.trim(), name: $('n').value.trim() }) });
    const d = await r.json();
    if (!r.ok) { $('msg').textContent = d.error || '追加に失敗しました。'; }
    else {
      localStorage.setItem('pw', $('pw').value);
      $('msg').textContent = `「${d.source.name}」を追加しました(${d.count}件を取得)。`;
      $('u').value = ''; $('n').value = '';
      await Promise.all([load(), loadSources()]);
    }
  } catch (e) { $('msg').textContent = '通信に失敗しました。'; }
  $('add').disabled = false;
}

async function removeSource(x) {
  if (!confirm(`「${x.name}」を削除しますか?取得済みの記事も消えます。`)) return;
  const r = await fetch('/api/sources', { method:'DELETE', headers: headers(), body: JSON.stringify({ id: x.id }) });
  const d = await r.json();
  $('msg').textContent = r.ok ? '削除しました。' : (d.error || '削除に失敗しました。');
  if (r.ok) { if (filter === x.id) filter = 'all'; await Promise.all([load(), loadSources()]); }
}

$('add').onclick = addSource;
$('manage').addEventListener('toggle', () => { if ($('manage').open) loadSources(); });
load();
</script>
</body>
</html>
