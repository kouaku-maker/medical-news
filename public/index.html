<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>透析・CE 新着チェック</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e4a5c">
<style>
  :root { --bg:#f3f6f8; --ink:#14262d; --sub:#5b6f77; --accent:#0e4a5c; --line:#d3dde2; --warn:#fff6e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10191d; --ink:#e6eef1; --sub:#93a7af; --accent:#5cc0d8; --line:#27373e; --warn:#2a2412; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    background:var(--bg); color:var(--ink);
    font:16px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width:32rem; margin:0 auto; padding:32px 0; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--sub); }
  .notice { background:var(--warn); border-left:3px solid var(--accent); padding:10px 14px; color:var(--ink); }
  button { display:block; width:100%; padding:14px; margin:0 0 12px; font:inherit; font-weight:600;
    border:1px solid var(--accent); border-radius:6px; background:var(--accent); color:var(--bg); }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.4; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #status { min-height:1.7em; color:var(--ink); }
  [hidden] { display:none; }
</style>
</head>
<body>
<main>
  <h1>透析・CE 新着チェック</h1>
  <p>PMDAや学会の新着を、毎朝1回お知らせします。</p>

  <div id="install" class="notice" hidden>
    iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」し、追加したアイコンから開き直してください。通知はそこから設定できます。
  </div>

  <button id="on">通知をオンにする</button>
  <button id="test" class="ghost" disabled>テスト通知を送る</button>
  <div id="status" role="status"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const status = (t) => ($('status').textContent = t);
const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iPhone|iPad/.test(navigator.userAgent);
if (isIOS && !standalone) { $('install').hidden = false; $('on').disabled = true; }

const b64 = (s) => {
  const p = '='.repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
};

async function currentSub() {
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

async function enable() {
  try {
    await navigator.serviceWorker.register('/sw.js');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return status('通知が許可されていません。設定アプリの通知から許可してください。');
    const { key } = await (await fetch('/api/vapid-key')).json();
    if (!key) return status('サーバーの設定(VAPIDキー)が未完了です。');
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    const r = await fetch('/api/subscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(sub) });
    if (!r.ok) throw new Error('subscribe failed');
    $('test').disabled = false;
    status('通知をオンにしました。');
  } catch (e) { status('設定に失敗しました。もう一度試してください。'); }
}

async function test() {
  const sub = await currentSub();
  if (!sub) return status('先に通知をオンにしてください。');
  const r = await fetch('/api/send-test', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(sub) });
  status(r.ok ? 'テスト通知を送りました。数秒待ってください。' : '送信に失敗しました。もう一度オンにしてください。');
}

$('on').onclick = enable;
$('test').onclick = test;
if ('serviceWorker' in navigator && 'PushManager' in window) {
  navigator.serviceWorker.register('/sw.js');
  currentSub().then((s) => { if (s) { $('test').disabled = false; status('通知はオンです。'); } });
} else if (!isIOS || standalone) {
  status('このブラウザは通知に対応していません。');
}
</script>
</body>
</html>
